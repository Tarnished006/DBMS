services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrimarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrimarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrimarket-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agrimarket
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agrimarket
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      JWT_SECRET: production_agrimarket_jwt_secret_2026_super_secure_key
      MANDI_API_BASE_URL: https://mandi-api.onrender.com/v1
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrimarket-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
